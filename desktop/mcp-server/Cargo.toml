[package]
name = "solflow-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
solflow-mcp-core = { path = "../mcp-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "=3.4.1", features = ["server", "transport-io", "macros"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
