# Публикация версии. Запускается по тегу вида v0.2.2: собирает установщик
# и выкладывает его релизом — оттуда же приложение узнаёт про обновления.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      # Ключи Google OAuth: в репозитории их нет (защита GitHub от утечек),
      # файл собирается из секрета. Без секрета — пустые ключи, Google Drive
      # в интерфейсе объяснит, что не настроен.
      - name: Ключи Google
        shell: bash
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        run: |
          if [ -n "$GOOGLE_OAUTH_JSON" ]; then printf '%s' "$GOOGLE_OAUTH_JSON" > google-oauth.json; \
          else echo '{"client_id":"","client_secret":""}' > google-oauth.json; fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: win-release-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: win-release-

      - name: Vulkan SDK
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\\vulkan_sdk.exe"
          & "$env:RUNNER_TEMP\\vulkan_sdk.exe" --root C:\\VulkanSDK --accept-licenses `
            --default-answer --confirm-command install | Out-Null
          "VULKAN_SDK=C:\\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\\VulkanSDK\\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: sherpa-onnx
        shell: bash
        run: |
          url=https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA}/sherpa-onnx-v${SHERPA}-win-x64-shared-MD-Release-no-tts-lib.tar.bz2
          curl -sL -o sherpa.tar.bz2 "$url"
          mkdir -p sherpa/win
          tar -xjf sherpa.tar.bz2 --strip-components=1 -C sherpa/win
          rm sherpa.tar.bz2
        env:
          SHERPA: 1.13.6

      # Библиотека саммери: llama.cpp со своим ggml одной DLL за узким
      # шимом. Версия закреплена коммитом — сборка должна повторяться.
      - name: Библиотека саммери (llama)
        shell: bash
        run: |
          git clone https://github.com/ggml-org/llama.cpp ../../llama.cpp
          git -C ../../llama.cpp checkout 0eadefebd3f8f92a86d634a0e5b8fffc9dc792c0
          cmake -S llama-shim -B shim-build -A x64 \
            -DLLAMA_DIR="$PWD/../../llama.cpp" -DSF_VULKAN=ON
          cmake --build shim-build --config Release -j 4
          mkdir -p llama/lib
          cp shim-build/Release/solflow_llama.dll llama/lib/
          cp shim-build/Release/solflow_llama.lib llama/lib/

      - name: Ставим tauri-cli
        run: npm install -g @tauri-apps/cli@^2

      # Ключ подписи обновлений лежит в секретах репозитория: приложение
      # ставит скачанное само, и без проверки подписи это была бы дыра.
      - name: Сборка
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          rm -rf target/release/bundle/nsis
          cargo build --release --locked --features gpu
          cp target/release/*.dll .
          cp sherpa/win/lib/*.dll .
          # Свежая DLL саммери — ПОСЛЕ target: в кэшированном target/release
          # лежит её прошлогодняя копия от упаковки, и она перетирала новую
          # (проверено md5 установщиков 0.5.1 и 0.5.2 — байт в байт).
          cp llama/lib/solflow_llama.dll .
          ls -la solflow_llama.dll
          tauri build --config tauri.gpu.conf.json --bundles nsis -- --features gpu

      # Релиз создаётся, если его ещё нет, и в него кладётся установщик.
      # Неподписанный .exe встречает SmartScreen — об этом сказано прямо в
      # описании релиза, чтобы человек не пугался.
      - name: Публикуем
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          {
            echo "Установщик для Windows."
            echo
            echo "Приложение не подписано, поэтому при первом запуске Windows покажет"
            echo "предупреждение SmartScreen: «Подробнее» → «Выполнить в любом случае»."
            echo
            echo "Распознавание идёт офлайн, модели скачиваются в самом приложении."
          } > notes.md
          # Имя без пробелов: адрес обновления должен быть простым, а
          # подпись считается по содержимому и переименования не боится.
          version="${tag#v}"
          out=SolFlow_${version}_x64-setup.exe
          cp target/release/bundle/nsis/*-setup.exe "$out"
          cp target/release/bundle/nsis/*-setup.exe.sig "$out.sig"

          # Манифест для встроенного обновления: по нему приложение узнаёт
          # версию, адрес файла и его подпись.
          jq -n \
            --arg version "$version" \
            --arg signature "$(cat "$out.sig")" \
            --arg url "https://github.com/isoloma-ux/solflow/releases/download/$tag/$out" \
            '{version: $version, notes: "Обновление Sol Flow",
              platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
            > latest.json
          cat latest.json

          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "Sol Flow $tag" --notes-file notes.md
          gh release upload "$tag" "$out" "$out.sig" latest.json --clobber
          # Релиз мог остаться черновиком: если тег перевыпускали, GitHub
          # прячет уже созданный релиз в черновики, и наружу он не виден —
          # приложение считает последней прошлую версию (проверено).
          gh release edit "$tag" --draft=false --latest

  # Mac-версия. Идёт после Windows, потому что дописывает свою платформу в
  # уже созданный манифест обновления.
  macos:
    needs: windows
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      # Ключи Google OAuth: в репозитории их нет (защита GitHub от утечек),
      # файл собирается из секрета. Без секрета — пустые ключи, Google Drive
      # в интерфейсе объяснит, что не настроен.
      - name: Ключи Google
        shell: bash
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        run: |
          if [ -n "$GOOGLE_OAUTH_JSON" ]; then printf '%s' "$GOOGLE_OAUTH_JSON" > google-oauth.json; \
          else echo '{"client_id":"","client_secret":""}' > google-oauth.json; fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: mac-release-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: mac-release-

      # Разделение говорящих: статические библиотеки k2-fsa. Свои такие же
      # собирались руками — в репозиторий они не влезают.
      - name: sherpa-onnx
        run: |
          url=https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA}/sherpa-onnx-v${SHERPA}-osx-arm64-static-lib.tar.bz2
          curl -sL -o sherpa.tar.bz2 "$url"
          mkdir -p sherpa
          tar -xjf sherpa.tar.bz2 --strip-components=1 -C sherpa
          rm sherpa.tar.bz2
          ls sherpa/lib | head
        env:
          SHERPA: 1.13.6

      - name: Ставим tauri-cli
        run: npm install -g @tauri-apps/cli@^2

      # Свой сертификат подписи. Он не меняется от версии к версии, и это
      # главное: разрешения (микрофон, универсальный доступ) macOS помнит по
      # удостоверению приложения. С подписью «на месте» удостоверением был
      # отпечаток файла — каждая сборка выглядела новым приложением, и права
      # приходилось выдавать заново.
      # Библиотека саммери: llama.cpp + шим одним dylib, Metal вшит.
      # Версия закреплена коммитом — сборка должна повторяться.
      - name: Библиотека саммери (llama)
        run: |
          git clone https://github.com/ggml-org/llama.cpp ../../llama.cpp
          git -C ../../llama.cpp checkout 0eadefebd3f8f92a86d634a0e5b8fffc9dc792c0
          sh llama-shim/build-macos.sh

      - name: Сертификат подписи
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k build build.keychain > /dev/null
          # Своему сертификату нужно доверие, иначе codesign не считает его
          # пригодным для подписи. Сам сертификат берём из связки, а не из
          # контейнера: openssl на раннере — LibreSSL, и ключи у него свои.
          security find-certificate -c "Sol Flow Signing" -p build.keychain > cert.pem
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain cert.pem
          security find-identity -v -p codesigning
          rm -f cert.p12 cert.pem

      - name: Сборка
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: "Sol Flow Signing"
        run: |
          rm -rf target/release/bundle/macos
          tauri build --bundles app --config tauri.mac-release.conf.json
          # Проверяем, что подпись «на месте» действительно легла: без неё
          # система объявляет скачанный бандл повреждённым (проверено).
          codesign --verify --verbose=1 "target/release/bundle/macos/Sol Flow.app"
          # Подпись должна быть нашим сертификатом: с «на месте» разрешения
          # слетали при каждом обновлении.
          codesign -dvv "target/release/bundle/macos/Sol Flow.app" 2>&1 \
            | grep -q "Authority=Sol Flow Signing" \
            || { echo "подписано не нашим сертификатом"; exit 1; }
          # Права должны быть на месте: в усиленном режиме без них система
          # молча отказывает в микрофоне, не задавая вопроса (проверено).
          codesign -d --entitlements - "target/release/bundle/macos/Sol Flow.app" 2>&1 \
            | grep -q "audio-input" \
            || { echo "нет права на микрофон в подписи"; exit 1; }

      # Приложение кладётся в архив с именем без пробелов, а в манифест
      # дописывается вторая платформа — к той, что уже положила Windows.
      - name: Публикуем
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          out=SolFlow_${version}_aarch64.app.tar.gz
          cp "target/release/bundle/macos/Sol Flow.app.tar.gz" "$out"
          cp "target/release/bundle/macos/Sol Flow.app.tar.gz.sig" "$out.sig"

          # Само приложение — отдельным архивом, чтобы его можно было просто
          # скачать и положить в «Программы».
          ditto -c -k --keepParent "target/release/bundle/macos/Sol Flow.app" \
            "SolFlow_${version}_macOS.zip"

          gh release download "$tag" -p latest.json --clobber
          jq \
            --arg signature "$(cat "$out.sig")" \
            --arg url "https://github.com/isoloma-ux/solflow/releases/download/$tag/$out" \
            '.platforms["darwin-aarch64"] = {signature: $signature, url: $url}' \
            latest.json > latest.new.json
          mv latest.new.json latest.json
          cat latest.json

          gh release upload "$tag" "$out" "$out.sig" "SolFlow_${version}_macOS.zip" \
            latest.json --clobber
          gh release edit "$tag" --draft=false --latest

