# Проверка сборки Sol Flow. Windows-версия правится с Mac вслепую, поэтому
# единственный честный ответ «скомпилировалось или нет» даёт этот прогон.
name: build

on:
  push:
    branches: [main, windows]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Версии инструментов
        run: |
          rustc -V
          cargo -V
          cmake --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: win-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: win-cargo-

      # Диаризация тянет статический sherpa-onnx, которого под MSVC ещё нет, —
      # она за фичей и в этом прогоне выключена.
      - name: cargo check
        run: cargo check --locked --no-default-features

  macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: mac-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: mac-cargo-

      # Библиотеки sherpa в репозиторий не кладутся (150 МБ), поэтому на CI
      # мак-сборка тоже проверяется без диаризации.
      - name: cargo check
        run: cargo check --locked --no-default-features

  # Установщик для Windows: его и ставят на живую машину для проверки.
  # Собирается на каждый push в main и по кнопке — лежит в артефактах
  # прогона неделю.
  installer:
    runs-on: windows-latest
    needs: windows
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: win-release-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: win-release-

      - name: Ставим tauri-cli
        run: npm install -g @tauri-apps/cli@^2

      # Через bash, а не pwsh: PowerShell съедает «--», и cargo не получает
      # свои аргументы (проверено падением прогона).
      - name: Сборка
        shell: bash
        run: tauri build --bundles nsis -- --no-default-features

      - uses: actions/upload-artifact@v4
        with:
          name: SolFlow-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Разведка: собирается ли Vulkan-бэкенд движка на стоковой машине без
  # отдельно поставленного Vulkan SDK. От ответа зависит, появится ли в
  # настройках переключатель «считать на видеокарте». Задача временная.
  vulkan-probe:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: win-vulkan-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: win-vulkan-

      # ggml-vulkan просит у CMake сам Vulkan и компилятор шейдеров glslc —
      # ни того, ни другого на стоковом раннере нет (проверено прогоном).
      # Ставим официальный SDK от LunarG молча, только ядро.
      - name: Vulkan SDK
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\vulkan_sdk.exe"
          & "$env:RUNNER_TEMP\vulkan_sdk.exe" --root C:\VulkanSDK --accept-licenses `
            --default-answer --confirm-command install | Out-Null
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: cargo check с vulkan
        shell: bash
        run: cargo check --no-default-features --features gpu

