# Проверка сборки Sol Flow. Windows-версия правится с Mac вслепую, поэтому
# единственный честный ответ «скомпилировалось или нет» даёт этот прогон.
name: build

on:
  push:
    branches: [main, windows]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Версии инструментов
        run: |
          rustc -V
          cargo -V
          cmake --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: win-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: win-cargo-

      # Диаризация тянет статический sherpa-onnx, которого под MSVC ещё нет, —
      # она за фичей и в этом прогоне выключена.
      - name: cargo check
        run: cargo check --locked --no-default-features

  macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: mac-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: mac-cargo-

      # Библиотеки sherpa в репозиторий не кладутся (150 МБ), поэтому на CI
      # мак-сборка тоже проверяется без диаризации.
      - name: cargo check
        run: cargo check --locked --no-default-features

  # Установщик для Windows: его и ставят на живую машину для проверки.
  # Собирается на каждый push в main и по кнопке — лежит в артефактах
  # прогона неделю.
  installer:
    runs-on: windows-latest
    needs: windows
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: win-release-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: win-release-

      # ggml-vulkan просит у CMake сам Vulkan и компилятор шейдеров glslc —
      # ни того, ни другого на стоковом раннере нет. Ставим официальный SDK
      # от LunarG молча.
      - name: Vulkan SDK
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\\vulkan_sdk.exe"
          & "$env:RUNNER_TEMP\\vulkan_sdk.exe" --root C:\\VulkanSDK --accept-licenses `
            --default-answer --confirm-command install | Out-Null
          "VULKAN_SDK=C:\\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\\VulkanSDK\\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Ставим tauri-cli
        run: npm install -g @tauri-apps/cli@^2

      # Через bash, а не pwsh: PowerShell съедает «--», и cargo не получает
      # свои аргументы (проверено падением прогона).
      # Движок в модульном режиме — это отдельные DLL (сам движок, ggml и
      # модули бэкендов). Cargo кладёт их рядом с экзешником в target, а в
      # установщик они попадают ресурсами. Список ресурсов лежит отдельным
      # конфигом и подмешивается только здесь: Tauri проверяет, что ресурсы
      # существуют, ещё на сборке, а в обычной проверке никаких DLL нет
      # (проверено падением прогона).
      - name: Сборка
        shell: bash
        run: |
          cargo build --release --locked --no-default-features --features gpu
          cp target/release/*.dll .
          ls -la *.dll
          tauri build --config tauri.gpu.conf.json --bundles nsis -- \
            --no-default-features --features gpu

      - uses: actions/upload-artifact@v4
        with:
          name: SolFlow-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
